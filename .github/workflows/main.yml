name: cypress integeration with CI
on:
 push: master
jobs:
 Test-on-chrome:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout
    uses: actions/checkout@v7.0.1
    - name : install dependencies
    uses: cypress-io/github-action@v5.0.0
    with:
     runTests: false
    - name: Run tests
    uses: cypress-io/github-action@v5.0.0
    with: 
      command: "npm run cy:test"
    - name : Upload video
      uses: actions/upload-artifact@v7.0.2
      if: always()
      with:
         name: cypress-video-chrome
         path:"${{github.workspace}}/cypress/videos"
     -name: upload screenshots
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: cypress-screenshot-chrome
          path: "${{github.workspace}}/cypress/screenshots"


     
    
